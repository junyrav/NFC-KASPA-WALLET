name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "feature/v0.8-ui" ]

permissions:
  contents: read

jobs:
  build:
    if: ${{ !startsWith(github.event.head_commit.message, 'Export APK tools') }}
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: '8.9'

      - name: Verify wrapper JAR
        run: echo "498495120a03b9a6ab5d155f5de3c8f0d986a449153702fb80fc80e134484f17  gradle/wrapper/gradle-wrapper.jar" | sha256sum --check

      - name: Build and verify wallet
        run: bash ./gradlew --write-verification-metadata sha256 :app:testDebugUnitTest :app:lintDebug :app:lintMainnet :app:assembleDebug :app:assembleMainnet :app:signingReport --stacktrace

      - name: Export dependency checksums
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: build-dependency-verification
          path: gradle/verification-metadata.xml
          if-no-files-found: warn

      - name: Upload unsigned mainnet APK (sign offline)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: NFC-KASPA-WALLET-mainnet-unsigned
          path: app/build/outputs/apk/mainnet/*-unsigned.apk
          if-no-files-found: error

      - name: Upload rendered screen review and test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wallet-visual-review
          path: |
            app/build/visual-review/
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
            app/build/reports/lint-results-debug.html
          if-no-files-found: warn

  verification-tool:
    if: ${{ startsWith(github.event.head_commit.message, 'Export APK tools') }}
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - name: Export APK verification tool
        run: |
          apk_signer_jar=$(find "$ANDROID_HOME/build-tools" -path '*/lib/apksigner.jar' -type f | sort -V | tail -n 1)
          test -f "$apk_signer_jar"
          mkdir -p verification-tools
          cp "$apk_signer_jar" verification-tools/apksigner.jar
      - name: Upload APK verification tool
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: apk-verification-tool
          path: verification-tools/apksigner.jar
          if-no-files-found: error
