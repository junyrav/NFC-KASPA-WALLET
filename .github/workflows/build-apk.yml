name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "feature/v0.8-ui" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # assembleDebug otherwise creates a new ~/.android/debug.keystore on a fresh
      # GitHub runner. Keeping that keystore stable lets later APKs install as
      # true in-place updates, so Android app data and AndroidKeyStore entries
      # are not destroyed between test builds.
      - name: Restore stable debug signing key
        uses: actions/cache@v4
        with:
          path: |
            ~/.android/debug.keystore
            ~/.config/.android/debug.keystore
          key: nfc-kaspa-wallet-debug-keystore-v1

      - name: Build debug APK
        run: gradle :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:signingReport --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NFC-KASPA-WALLET-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload rendered screen review and test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wallet-visual-review
          path: |
            app/build/visual-review/
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
            app/build/reports/lint-results-debug.html
          if-no-files-found: warn
