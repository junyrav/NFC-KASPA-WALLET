name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "feature/v0.8-ui" ]

jobs:
  build:
    if: ${{ !startsWith(github.event.head_commit.message, 'Export APK tools') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle :app:testDebugUnitTest :app:lintDebug :app:lintMainnet :app:assembleDebug :app:assembleMainnet :app:signingReport --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NFC-KASPA-WALLET-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload unsigned mainnet APK (sign offline)
        uses: actions/upload-artifact@v4
        with:
          name: NFC-KASPA-WALLET-mainnet-unsigned
          path: app/build/outputs/apk/mainnet/*-unsigned.apk
          if-no-files-found: error

      - name: Upload rendered screen review and test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wallet-visual-review
          path: |
            app/build/visual-review/
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
            app/build/reports/lint-results-debug.html
          if-no-files-found: warn

  verification-tool:
    if: ${{ startsWith(github.event.head_commit.message, 'Export APK tools') }}
    runs-on: ubuntu-latest
    steps:
      - name: Export APK verification tool
        run: |
          apk_signer_jar=$(find "$ANDROID_HOME/build-tools" -path '*/lib/apksigner.jar' -type f | sort -V | tail -n 1)
          test -f "$apk_signer_jar"
          mkdir -p verification-tools
          cp "$apk_signer_jar" verification-tools/apksigner.jar
      - name: Upload APK verification tool
        uses: actions/upload-artifact@v4
        with:
          name: apk-verification-tool
          path: verification-tools/apksigner.jar
          if-no-files-found: error
